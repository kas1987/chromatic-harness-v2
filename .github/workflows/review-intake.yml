name: Chromatic Review Intake

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [synchronize]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

defaults:
  run:
    shell: bash

jobs:
  ingest-review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure review intake folders exist
        run: |
          mkdir -p 07_LOGS_AND_AUDIT/review_intake/locks
          touch 07_LOGS_AND_AUDIT/review_intake/findings.jsonl
          test -f 07_LOGS_AND_AUDIT/review_intake/queue.json || echo '{"items":[]}' > 07_LOGS_AND_AUDIT/review_intake/queue.json

      - name: Record intake workflow start time
        run: |
          echo "INTAKE_START=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          mkdir -p 07_LOGS_AND_AUDIT/review_intake/timing
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') workflow_started" >> 07_LOGS_AND_AUDIT/review_intake/timing/event_${{ github.event.number || 0 }}.log

      - name: Ingest GitHub review event
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/review_intake.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --findings 07_LOGS_AND_AUDIT/review_intake/findings.jsonl \
            --queue 07_LOGS_AND_AUDIT/review_intake/queue.json \
            --state 07_LOGS_AND_AUDIT/review_intake/state.json
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') ingest_complete" >> 07_LOGS_AND_AUDIT/review_intake/timing/event_${{ github.event.number || 0 }}.log

      - name: Optionally dispatch to beads (if 'review-intake: analyze' tag present)
        continue-on-error: true
        run: |
          if grep -q "review-intake: analyze" 07_LOGS_AND_AUDIT/review_intake/findings.jsonl 2>/dev/null; then
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') dispatch_attempted" >> 07_LOGS_AND_AUDIT/review_intake/timing/event_${{ github.event.number || 0 }}.log
            python scripts/dispatch_review_work.py \
              --queue 07_LOGS_AND_AUDIT/review_intake/queue.json \
              --emit-beads 2>&1 | tee -a 07_LOGS_AND_AUDIT/review_intake/dispatch.log || true
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') dispatch_complete" >> 07_LOGS_AND_AUDIT/review_intake/timing/event_${{ github.event.number || 0 }}.log
          else
            echo "No 'review-intake: analyze' tag found; skipping dispatch"
          fi

      # State is published as a workflow artifact rather than pushed to a protected
      # branch. A downstream collector (scripts/review_intake_central_collector.py)
      # ingests these artifacts; this keeps the default branch immutable from CI.
      - name: Publish intake artifacts
        uses: actions/upload-artifact@v7
        with:
          name: review-intake-state-${{ github.run_id }}
          path: 07_LOGS_AND_AUDIT/review_intake/
          if-no-files-found: warn
          retention-days: 14
