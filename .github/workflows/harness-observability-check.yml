name: Harness Observability Health Check

# Runs the observability validators in CI on every PR / non-default-branch push
# so observability tooling never silently drifts (OBS-008).
#
# Job id `validate-harness-observability` is referenced by the OBS-008 bead.

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: obs-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-harness-observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile observability scripts
        # compileall is resilient to scripts being added/removed over time.
        run: python -m compileall -q scripts/

      - name: Validate starter event log (schema)
        run: |
          # ERROR_LOG.jsonl is runtime-generated and gitignored; seed an empty
          # placeholder on a clean checkout so the validator runs structure
          # checks. When real lines are present, malformed events fail the gate.
          LOG=00_META/observability/ERROR_LOG.jsonl
          mkdir -p "$(dirname "$LOG")"
          [ -f "$LOG" ] || touch "$LOG"
          python scripts/validate_event_log.py --log "$LOG"

      - name: Install dependency scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Run secret scan
        # security_scan.py writes 07_LOGS_AND_AUDIT/security/latest.json.
        # Run full mode (with dependencies) to avoid skipped dependency status.
        run: python scripts/security_scan.py

      - name: Run collision detector against active writers
        run: |
          python scripts/detect_file_collisions.py \
            --active-writers .chromatic/active_writers.json

      - name: Upload observability health artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: observability-health
          path: |
            07_LOGS_AND_AUDIT/security/latest.json
            07_LOGS_AND_AUDIT/collision/latest.json
          if-no-files-found: ignore
