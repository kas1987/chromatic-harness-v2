# Unified routing-table source for runtime routing.
#
# - routes: legacy task-type routing used by PolicyLoader.route_for_task().
# - context_matrix: context-aware provider selection used by ProviderSelector.

version: "2.0"

routes:
  classification:
    default: ollama
    fallback: [lmstudio, featherless]
    max_privacy: P2

  planning:
    default: agnes
    fallback: [anthropic, openai, google]
    max_privacy: P2

  coding:
    default: kimi
    fallback: [ollama_cloud, kimi, openai, anthropic]
    max_privacy: P1

  review:
    default: agnes
    fallback: [ollama_cloud, anthropic, openai, google]
    max_privacy: P2

  research:
    default: agnes
    fallback: [ollama_cloud, openai, google, anthropic]
    max_privacy: P1

  personal_context:
    default: openhuman
    fallback: [local_vault]
    max_privacy: P2
    human_gate_required: false

  integration_action:
    default: openhuman
    fallback: []
    max_privacy: P2
    human_gate_required: true

context_matrix:
  # ── Laptop (no GPU) ───────────────────────────────────────────────────────
  context_laptop:
    speed:
      C1: [ollama_local:llama3.2:3b, gemini:gemini-2.5-flash, native_claude, omniroute:oc/deepseek-v4-flash-free]
      C2: [gemini:gemini-2.5-flash, agnes:agnes-2.5-flash, openai:gpt-4o-mini, ollama_local:qwen2.5-coder:14b, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, gemini:gemini-2.5-pro, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, claude_api:sonnet, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, claude_api:sonnet, omniroute:oc/kimi-k2-thinking-free, openrouter:anthropic/claude-sonnet-4-6, gemini:gemini-2.5-pro]

    balance:
      C1: [ollama_local:llama3.2:3b, ollama_local:qwen2.5-coder:14b, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_local:qwen2.5-coder:14b, agnes:agnes-2.5-flash, gemini:gemini-2.5-flash, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, gemini:gemini-2.5-pro, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, claude_api:sonnet, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, gemini:gemini-2.5-pro, claude_api:sonnet, omniroute:oc/kimi-k2-thinking-free, openrouter:anthropic/claude-sonnet-4-6]

    low:
      C1: [ollama_local:llama3.2:3b]
      C2: [ollama_local:qwen2.5-coder:14b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [ollama_local:qwen2.5-coder:14b, gemini:gemini-2.5-pro, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [ollama_local:qwen2.5-coder:14b, gemini:gemini-2.5-pro]

  # ── Laptop + Remote Desktop on LAN ───────────────────────────────────────
  context_laptop_remote:
    speed:
      C1: [ollama_local:llama3.2:3b, gemini:gemini-2.5-flash, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_remote_desktop:qwen2.5-coder:14b, gemini:gemini-2.5-flash, omniroute:oc/qwen3-coder-free, openrouter:moonshotai/kimi-k2-6, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, ollama_remote_desktop:qwen2.5-coder:14b, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, gemini:gemini-2.5-pro, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, openrouter:anthropic/claude-sonnet-4-6, omniroute:oc/kimi-k2-thinking-free, gemini:gemini-2.5-pro, claude_api:sonnet]

    balance:
      C1: [ollama_local:llama3.2:3b, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_remote_desktop:llama3.1:8b, ollama_local:qwen2.5-coder:14b, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, ollama_remote_desktop:qwen2.5-coder:14b, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, gemini:gemini-2.5-pro, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, gemini:gemini-2.5-pro, claude_api:sonnet, omniroute:oc/kimi-k2-thinking-free, openrouter:anthropic/claude-sonnet-4-6]

    low:
      C1: [ollama_local:llama3.2:3b]
      C2: [ollama_remote_desktop:llama3.1:8b, ollama_local:qwen2.5-coder:14b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [ollama_remote_desktop:qwen2.5-coder:14b, ollama_local:qwen2.5-coder:14b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [ollama_remote_desktop:gemma2:27b, ollama_remote_desktop:qwen2.5-coder:14b]

  # ── Desktop (RTX 4070, GPU inference) ────────────────────────────────────
  context_desktop:
    speed:
      C1: [ollama_local:llama3.1:8b, gemini:gemini-2.5-flash, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_local:llama3.1:8b, gemini:gemini-2.5-flash, together_ai:moonshotai/Kimi-K2.6, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, ollama_local:qwen2.5-coder:14b, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, gemini:gemini-2.5-pro, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, openrouter:anthropic/claude-sonnet-4-6, omniroute:oc/kimi-k2-thinking-free, gemini:gemini-2.5-pro, claude_api:sonnet]

    balance:
      C1: [ollama_local:llama3.1:8b, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_local:llama3.1:8b, agnes:agnes-2.5-flash, ollama_local:qwen2.5-coder:14b, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, ollama_local:qwen2.5-coder:14b, ollama_local:gemma2:9b, omniroute:oc/deepseek-r1-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, gemini:gemini-2.5-pro, claude_api:sonnet, omniroute:oc/kimi-k2-thinking-free, openrouter:anthropic/claude-sonnet-4-6]

    low:
      C1: [ollama_local:llama3.1:8b]
      C2: [ollama_local:llama3.1:8b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [ollama_local:qwen2.5-coder:14b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [ollama_local:gemma2:9b, ollama_local:qwen2.5-coder:14b]

  # ── Server / always-on machine ───────────────────────────────────────────
  context_server:
    speed:
      C1: [ollama_local:llama3.1:8b, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_local:qwen2.5-coder:14b, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, ollama_local:gemma2:27b, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, gemini:gemini-2.5-pro, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, claude_api:sonnet, omniroute:oc/kimi-k2-thinking-free, openrouter:anthropic/claude-sonnet-4-6, gemini:gemini-2.5-pro]

    balance:
      C1: [ollama_local:llama3.1:8b, omniroute:oc/deepseek-v4-flash-free]
      C2: [ollama_local:qwen2.5-coder:14b, omniroute:oc/qwen3-coder-free, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [native_claude, agnes:agnes-2.5-flash, ollama_local:qwen2.5-coder:14b, omniroute:oc/deepseek-r1-free, openrouter:moonshotai/kimi-k2-6, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [native_claude, agnes:agnes-2.5-flash, ollama_local:gemma2:27b, gemini:gemini-2.5-pro, omniroute:oc/kimi-k2-thinking-free, openrouter:anthropic/claude-sonnet-4-6]

    low:
      C1: [ollama_local:llama3.1:8b]
      C2: [ollama_local:qwen2.5-coder:14b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C3: [ollama_local:qwen2.5-coder:14b, ollama_kimi_cloud:kimi-k2.7-code:cloud]
      C4: [ollama_local:gemma2:27b]
