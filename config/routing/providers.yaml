# Provider inventory — canonical PDR format
# Loaded by PolicyLoader from src/chromatic_router or 02_RUNTIME/router.

version: "2.0"

providers:
  # Logical Ollama providers. The adapter factory matches these via the
  # "ollama" prefix in adapters.yaml and instantiates OllamaRemoteAdapter
  # with the provider-specific host/port/model. This removes the need for
  # runtime alias mapping inside router.py.
  ollama_local:
    type: local
    enabled: true
    host: localhost
    port: 11434
    model: llama3.2:3b
    privacy_max: P2

  ollama_remote_desktop:
    type: local
    enabled: true
    host: desktop.local
    port: 11434
    model: llama3.1:8b
    privacy_max: P2

  ollama_remote:
    type: local
    enabled: true
    host: localhost
    port: 11434
    model: llama3.2:3b
    privacy_max: P2

  ollama_cloud:
    type: frontier
    enabled: true
    base_url: https://ollama.com
    env_key: OLLAMA_API_KEY
    model: gpt-oss:20b
    fallback_models:
      - qwen3.5:397b
      - gpt-oss:120b
    privacy_max: P1
    note: "Ollama.com frontier cloud API; default model plus fallback models reduce breakage from model catalog churn."

  lmstudio:
    type: local
    enabled: true
    host: host.docker.internal
    port: 1234
    privacy_max: P2

  openai:
    type: frontier
    enabled: true
    env_key: OPENAI_API_KEY
    privacy_max: P2

  anthropic:
    type: frontier
    enabled: true
    env_key: ANTHROPIC_API_KEY
    privacy_max: P2

  google:
    type: frontier
    enabled: true
    env_key: GOOGLE_API_KEY
    privacy_max: P2

  agnes:
    type: frontier
    enabled: true
    env_key: AGNES_API_KEY
    base_url: https://apihub.agnes-ai.com/v1
    model: agnes-2.5-flash
    privacy_max: P1

  # Broker policy: docs/governance/OPENROUTER_BROKER_POLICY.md
  openrouter:
    type: broker
    enabled: true
    env_key: OPENROUTER_API_KEY
    privacy_max: P1

  featherless:
    type: broker
    enabled: true
    env_key: FEATHERLESS_API_KEY
    privacy_max: P1

  openhuman:
    type: sidecar
    enabled: false
    base_url: http://127.0.0.1:8787
    env_key: OPENHUMAN_BEARER_TOKEN
    privacy_max: P2
    default_mode: read_only

  native_claude:
    type: native
    enabled: true
    privacy_max: P2

  kimi:
    type: broker
    enabled: true
    base_url: https://api.moonshot.cn/v1
    env_key: MOONSHOT_API_KEY
    model: moonshot-v1-32k
    privacy_max: P1
    role: builder_scout

  prism-orchestrator:
    type: cross_project
    enabled: true
    base_url: http://host.docker.internal:8000
    env_key: PRISM_ORCHESTRATOR_ENABLED
    privacy_max: P2

  mock:
    type: test
    enabled: false
    privacy_max: P2
